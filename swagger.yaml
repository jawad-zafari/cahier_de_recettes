openapi: 3.0.0
info:
  title: API Cahier de Recettes
  version: 1.0.0
  description: Documentation complète de l'API pour gérer les recettes de cuisine et les utilisateurs.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /utilisateurs/inscription:
    post:
      summary: Inscription d'un nouvel utilisateur
      tags:
        - Utilisateurs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom:
                  type: string
                email:
                  type: string
                motDePasse:
                  type: string
      responses:
        '201':
          description: Utilisateur créé avec succès
        '400':
          description: Cet email est déjà utilisé ou informations invalides
  /utilisateurs/connexion:
    post:
      summary: Connexion de l'utilisateur
      tags:
        - Utilisateurs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                motDePasse:
                  type: string
      responses:
        '200':
          description: Connexion réussie (retourne le token)
        '400':
          description: Email ou mot de passe incorrect
  /recettes:
    get:
      summary: Obtenir toutes les recettes
      tags:
        - Recettes
      parameters:
        - in: query
          name: auteur
          schema:
            type: string
          description: Filtrer les recettes par auteur
        - in: query
          name: ingredient
          schema:
            type: string
          description: Filtrer les recettes par ingrédient
      responses:
        '200':
          description: Liste des recettes récupérée avec succès
    post:
      summary: Ajouter une nouvelle recette
      tags:
        - Recettes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titre:
                  type: string
                ingredients:
                  type: array
                  items:
                    type: string
                etapes:
                  type: string
                auteur:
                  type: string
      responses:
        '201':
          description: Recette créée avec succès
        '401':
          description: Accès refusé (Token manquant ou invalide)
  /recettes/{id}:
    get:
      summary: Obtenir une recette spécifique par son ID
      tags:
        - Recettes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: L'ID de la recette
      responses:
        '200':
          description: Recette trouvée et retournée
        '404':
          description: Recette non trouvée
    patch:
      summary: Modifier une recette existante
      tags:
        - Recettes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: L'ID de la recette à modifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titre:
                  type: string
                etapes:
                  type: string
      responses:
        '200':
          description: Recette mise à jour avec succès
        '401':
          description: Accès refusé
        '404':
          description: Recette non trouvée
    delete:
      summary: Supprimer une recette
      tags:
        - Recettes
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: L'ID de la recette à supprimer
      responses:
        '200':
          description: Recette supprimée avec succès
        '401':
          description: Accès refusé
        '404':
          description: Recette non trouvée
  /recettes/{id}/commentaires:
    post:
      summary: Ajouter un commentaire à une recette
      tags:
        - Commentaires
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: L'ID de la recette pour ajouter le commentaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                texte:
                  type: string
                auteur:
                  type: string
      responses:
        '201':
          description: Commentaire ajouté avec succès
        '404':
          description: Recette non trouvée